# Release configuration for mod-tools: the API library, released on GitHub
# beside the mod under its own ValheimCommunityPatch.API-v* tags.
# Shared settings come from the preset, which ships inside the gem.
#
# Inspect what this actually resolves to:
#   mod-tools print-config --root ValheimCommunityPatch.API

extends:  library-mono
assembly: ValheimCommunityPatch.API

# Zipped beside the DLL and its XML documentation, for mods that copy the
# file rather than reference the binary.
library_files:
  - CommunityPatchAPI.cs
  - README.md
  - CHANGELOG.md

publish:
  github:
    enabled: true
