# Release configuration for mod-tools.
# Shared settings come from the preset, which ships inside the gem.
#
# Inspect what this actually resolves to:
#   mod-tools print-config

extends:  jotunn
assembly: ValheimCommunityPatch

# The Thunderstore/Hexium team these publish under.
author_name: MidnightMods

# Copy the build into this machine's mod manager profiles after every
# build.
deploy:
  enabled: true

publish:
  thunderstore:
    enabled: true
  nexus:
    enabled: true
    mod_id: 3617
    file_id: 7939494
  github:
    enabled: true
  discord:
    enabled: true
